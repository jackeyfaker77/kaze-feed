[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaze-feed"
version = "0.1.0"
description = "Independent RSS and Atom MCP service for Kaze"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "feedparser==6.0.14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
kaze-feed = "kaze_feed.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
